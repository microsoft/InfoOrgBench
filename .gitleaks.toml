# Secret-scanning configuration for gitleaks (https://github.com/gitleaks/gitleaks).
title = "InfoOrgBench"

[extend]
useDefault = true

# Each allowlist names its rule with targetRules. Without targetRules, a global allowlist that lists paths skips
# those files entirely, so the regex condition would not apply.

[[allowlists]]
description = """Upstream Apache Hadoop Jira text (HADOOP-18839) shows a docker command with a \
placeholder MinIO secret key and root password for a local test container. Thread packets redistribute that \
public text unchanged; it is not a credential for any live system."""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''MINIO_SECRET_KEY=Eevoh2wo0ui6ech0wu8oy3feiR3eicha''',
  '''MINIO_ROOT_PASSWORD=iepaegaigi3ofa9TaephieSo1iecaesh''',
]
paths = ['''^benchmark/inputs/public/Thread/mini-\d{3}\.json$''']

[[allowlists]]
description = """System identifiers in the results ledger and harness configuration, stored under a JSON \
field named "key" (for example "claude-haiku-4-5__pi"). They name a model and harness pairing, not a credential."""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^key": "[a-z0-9-]+__(react-fc|pi|deep-agents|dsh|codex)"$''']
paths = ['''^results/systems\.json$''', '''^harness/configs/table3-systems\.json$''']

[[allowlists]]
description = """Model-written folder labels for Kubernetes proposals about KMS v2 encryption, for example \
"kms-v2-encryption". They are topic names in assignment trees, not credentials."""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''(?i)^(kms-v2-encryption|encryption-kms-v2)$''']
paths = ['''^results/assignments/[a-z0-9-]+__[a-z-]+\.json$''']