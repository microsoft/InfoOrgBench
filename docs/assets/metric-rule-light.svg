<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="For any 3 records the source hierarchy says which 2 belong closer. The output agrees, conflicts by pairing a different 2, or leaves the 3 unresolved.">
